<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030516">
  <title>LEARNEX AI</title>
  <link rel="icon" href="/learnex-logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="splash" class="splash">
    <img src="/learnex-loading.png" alt="LEARNEX AI">
    <button id="skipSplash">Skip</button>
  </div>

  <div class="app">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn">☰</button>
      <div class="brand">
        <img src="/learnex-logo.png" alt="LEARNEX AI">
        <div><strong>Learnex <span>AI</span></strong><small><i></i> Educational assistant</small></div>
      </div>
      <button id="clearBtn" class="clear-btn">✦ Clear</button>
    </header>

    <aside id="sidebar" class="sidebar">
      <div class="side-title"><b>LEARNEX AI</b><button id="closeSide">×</button></div>
      <button id="newChat" class="new-chat">＋ New chat</button>
      <div id="history" class="history"></div>
      <div class="side-foot">LEARN. EXPLORE. EXCEL.</div>
    </aside>
    <div id="overlay" class="overlay"></div>

    <main id="chat" class="chat">
      <section id="welcome" class="welcome">
        <div class="hero-logo"><img src="/learnex-logo.png" alt=""></div>
        <h1>What would you <span>like to learn?</span></h1>
        <p>Ask anything you're studying. Learnex will respond clearly and help you understand.</p>
        <div class="suggestions">
          <button data-prompt="Explain fractions like I'm 12">√x&nbsp; Explain fractions like I'm 12 <b>＋</b></button>
          <button data-prompt="Explain photosynthesis">◈&nbsp; Explain photosynthesis <b>＋</b></button>
          <button data-prompt="Solve 57686 × 7487 ÷ 789 step by step">∑&nbsp; Solve a math problem <b>＋</b></button>
          <button data-prompt="Explain neural networks simply">✦&nbsp; Explain neural networks <b>＋</b></button>
        </div>
      </section>
      <div id="messages" class="messages"></div>
    </main>

    <form id="composer" class="composer">
      <button id="attachBtn" type="button" class="round-btn">＋</button>
      <textarea id="input" rows="1" placeholder="Ask a question..." autocomplete="off"></textarea>
      <button id="voiceBtn" type="button" class="round-btn voice">◉</button>
      <button class="send-btn" type="submit">➤</button>
    </form>
    <div class="send-hint">Enter to send · Shift + Enter for a new line</div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
