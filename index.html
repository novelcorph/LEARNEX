<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#030517" />
  <meta name="description" content="Learnex AI — bilingual educational assistant." />
  <title>Learnex AI</title>
  <link rel="icon" type="image/png" href="/learnex-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)'], ['$', '$']],
        displayMath: [['\\[', '\\]'], ['$$', '$$']],
        processEscapes: true
      },
      options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <div id="splash" class="splash" aria-label="Learnex AI loading screen">
    <img src="/learnex-loading.png" alt="Learnex AI loading" />
  </div>

  <div id="app" class="app-shell is-hidden">
    <header class="topbar glass">
      <button id="menuBtn" class="icon-btn" aria-label="Open menu">☰</button>
      <div class="brand">
        <img src="/learnex-icon.png" alt="Learnex AI" class="brand-icon" />
        <div>
          <div class="brand-name">Learnex <span>AI</span></div>
          <div class="brand-status"><i></i> Educational assistant</div>
        </div>
      </div>
      <button id="clearBtn" class="clear-btn">✦ Clear</button>
    </header>

    <aside id="sidebar" class="sidebar glass">
      <div class="sidebar-head">
        <strong>Learnex AI</strong>
        <button id="closeMenu" class="icon-btn" aria-label="Close menu">×</button>
      </div>
      <button id="newChatBtn" class="new-chat">＋ New chat</button>
      <div class="side-label">Recent chats</div>
      <div id="history" class="history"></div>
      <div class="side-footer">Learn. Explore. Excel.<br><span>BY ARIJIT DAS</span></div>
    </aside>

    <main class="main">
      <section id="welcome" class="welcome">
        <div class="hero-logo">
          <div class="orbital orbital-a"></div>
          <div class="orbital orbital-b"></div>
          <img src="/learnex-icon.png" alt="Learnex AI logo" />
        </div>
        <h1>What would you <span>like to learn?</span></h1>
        <p>Ask a question in English. Learnex answers in the language you use.</p>

        <div class="suggestions">
          <button data-prompt="Explain fractions like I'm 12">√x <span>Explain fractions like I'm 12</span><b>＋</b></button>
          <button data-prompt="Explain photosynthesis">◈ <span>Explain photosynthesis</span><b>＋</b></button>
          <button data-prompt="Explain gravity simply">Aa <span>Explain gravity</span><b>＋</b></button>
          <button data-prompt="Explain neural networks simply">◎ <span>Explain neural networks</span><b>＋</b></button>
        </div>
      </section>

      <section id="chat" class="chat" aria-live="polite"></section>
      <div id="dotsLoader" class="dots-loader is-hidden" aria-label="Generating response"><i></i><i></i><i></i></div>
    </main>

    <footer class="composer-wrap">
      <div class="composer glass">
        <button id="attachBtn" class="round-btn" title="New chat">＋</button>
        <textarea id="prompt" rows="1" placeholder="Ask a question..." autocomplete="off"></textarea>
        <button id="micBtn" class="round-btn mic" title="Voice input" aria-label="Voice input">◉</button>
        <button id="sendBtn" class="send-btn" title="Send" aria-label="Send">➤</button>
      </div>
      <div class="composer-hint">Enter to send · Shift + Enter for a new line</div>
    </footer>
  </div>

  <script src="/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
